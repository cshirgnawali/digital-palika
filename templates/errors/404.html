{% extends 'layout.html' %}

{% block title %}Page Not Found{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center align-items-center" style="min-height: 80vh;">

        <div class="col-lg-6 text-center">

            <div class="card border-0 shadow-lg rounded-4 p-5">

                <i class="bi bi-exclamation-triangle-fill text-warning display-1 mb-4"></i>

                <h1 class="display-4 fw-bold mb-3">404</h1>

                <h3 class="fw-semibold mb-3">Page Not Found</h3>

                <p class="text-muted mb-4">
                    The page you are looking for does not exist or may have been moved.
                </p>

                <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">

                    <a href="{{ url_for('auth.login') }}"
                       class="btn btn-primary px-4 py-2 rounded-3 fw-semibold">

                        <i class="bi bi-house-door-fill me-2"></i>
                        Go to Login

                    </a>

                    <a href="javascript:history.back()"
                       class="btn btn-outline-secondary px-4 py-2 rounded-3 fw-semibold">

                        <i class="bi bi-arrow-left me-2"></i>
                        Go Back

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% include 'includes/footer.html' %}

{% endblock %}
