{% extends "layout.html" %}

{% block title %}Add Budget{% endblock %}

{% block content %}

<div class="d-flex">

    {% include 'includes/sidebar.html' %}

    <div class="main-content">

        {% include 'includes/navbar.html' %}

        <div class="container-fluid p-4">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">

                    <h4 class="mb-0">
                        Add Budget
                    </h4>

                </div>

                <div class="card-body">

                    {% if error %}

                        <div class="alert alert-danger">

                            {{ error }}

                        </div>

                    {% endif %}

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">
                                Project
                            </label>

                            <select
                                name="project_id"
                                class="form-select"
                                required>

                                <option value="">
                                    Select Project
                                </option>

                                {% for project in projects %}

                                <option value="{{ project[0] }}">

                                    {{ project[1] }}

                                </option>

                                {% endfor %}

                            </select>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Fiscal Year
                            </label>

                            <input
                                type="text"
                                name="fiscal_year"
                                class="form-control"
                                placeholder="2082/83"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Allocated Amount
                            </label>

                            <input
                                type="number"
                                step="0.01"
                                name="allocated_amount"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Spent Amount
                            </label>

                            <input
                                type="number"
                                step="0.01"
                                value="0"
                                name="spent_amount"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Budget Status
                            </label>

                            <select
                                name="budget_status"
                                class="form-select">

                                <option>Allocated</option>
                                <option>In Progress</option>
                                <option>Completed</option>

                            </select>

                        </div>

                        <button class="btn btn-success">

                            <i class="bi bi-check-circle-fill"></i>

                            Save Budget

                        </button>

                        <a href="{{ url_for('budgets.budget_list') }}"
                           class="btn btn-secondary">

                            Cancel

                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
