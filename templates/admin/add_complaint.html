{% extends "layout.html" %}

{% block title %}Add Complaint{% endblock %}

{% block content %}

<div class="d-flex">

    {% include 'includes/sidebar.html' %}

    <div class="main-content">

        {% include 'includes/navbar.html' %}

        <div class="container-fluid p-4">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">

                    <h4 class="mb-0">

                        Add Complaint

                    </h4>

                </div>

                <div class="card-body">

                    {% if error %}

                        <div class="alert alert-danger">

                            {{ error }}

                        </div>

                    {% endif %}

                    <form method="POST">

                        <!-- User -->

                        <div class="mb-3">

                            <label class="form-label">
                                Citizen
                            </label>

                            <select
                                name="user_id"
                                class="form-select"
                                required>

                                <option value="">
                                    Select Citizen
                                </option>

                                {% for user in users %}

                                <option value="{{ user[0] }}">

                                    {{ user[1] }}

                                </option>

                                {% endfor %}

                            </select>

                        </div>

                        <!-- Department -->

                        <div class="mb-3">

                            <label class="form-label">
                                Department
                            </label>

                            <select
                                name="department_id"
                                class="form-select"
                                required>

                                <option value="">
                                    Select Department
                                </option>

                                {% for department in departments %}

                                <option value="{{ department[0] }}">

                                    {{ department[1] }}

                                </option>

                                {% endfor %}

                            </select>

                        </div>

                        <!-- Ward -->

                        <div class="mb-3">

                            <label class="form-label">
                                Ward
                            </label>

                            <select
                                name="ward_id"
                                class="form-select"
                                required>

                                <option value="">
                                    Select Ward
                                </option>

                                {% for ward in wards %}

                                <option value="{{ ward[0] }}">

                                    Ward {{ ward[1] }}

                                </option>

                                {% endfor %}

                            </select>

                        </div>

                        <!-- Title -->

                        <div class="mb-3">

                            <label class="form-label">
                                Complaint Title
                            </label>

                            <input
                                type="text"
                                name="title"
                                class="form-control"
                                required>

                        </div>

                        <!-- Description -->

                        <div class="mb-3">

                            <label class="form-label">
                                Description
                            </label>

                            <textarea
                                name="description"
                                rows="4"
                                class="form-control"
                                required></textarea>

                        </div>

                        <!-- Location -->

                        <div class="mb-3">

                            <label class="form-label">
                                Location
                            </label>

                            <input
                                type="text"
                                name="location"
                                class="form-control">

                        </div>

                        <!-- Priority -->

                        <div class="mb-3">

                            <label class="form-label">
                                Priority
                            </label>

                            <select
                                name="priority"
                                class="form-select">

                                <option>Low</option>
                                <option selected>Medium</option>
                                <option>High</option>

                            </select>

                        </div>

                        <!-- Status -->

                        <div class="mb-3">

                            <label class="form-label">
                                Status
                            </label>

                            <select
                                name="status"
                                class="form-select">

                                <option selected>Pending</option>
                                <option>In Progress</option>
                                <option>Resolved</option>
                                <option>Rejected</option>

                            </select>

                        </div>

                        <button class="btn btn-success">

                            <i class="bi bi-check-circle-fill"></i>

                            Save Complaint

                        </button>

                        <a href="{{ url_for('complaints.complaint_list') }}"
                           class="btn btn-secondary">

                            Cancel

                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
