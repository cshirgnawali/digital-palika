{% extends "layout.html" %}

{% block title %}Edit User{% endblock %}

{% block content %}

<div class="d-flex">

    {% include 'includes/sidebar.html' %}

    <div class="main-content">

        {% include 'includes/navbar.html' %}

        <div class="container-fluid p-4">

            <h2 class="mb-4">Edit User</h2>

            <div class="card shadow">

                <div class="card-body">

                    <form method="POST">

                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text"
                                   class="form-control"
                                   name="full_name"
                                   value="{{ user[1] }}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email"
                                   class="form-control"
                                   value="{{ user[2] }}"
                                   readonly>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Phone</label>
                            <input type="text"
                                   class="form-control"
                                   name="phone"
                                   value="{{ user[3] }}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Role</label>

                            <select class="form-select" name="role">

                                <option value="admin"
                                    {% if user[4]=='admin' %}selected{% endif %}>
                                    Admin
                                </option>

                                <option value="mayor"
                                    {% if user[4]=='mayor' %}selected{% endif %}>
                                    Mayor
                                </option>

                                <option value="staff"
                                    {% if user[4]=='staff' %}selected{% endif %}>
                                    Staff
                                </option>

                                <option value="citizen"
                                    {% if user[4]=='citizen' %}selected{% endif %}>
                                    Citizen
                                </option>

                            </select>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">Status</label>

                            <select class="form-select" name="status">

                                <option value="active"
                                    {% if user[5]=='active' %}selected{% endif %}>
                                    Active
                                </option>

                                <option value="inactive"
                                    {% if user[5]=='inactive' %}selected{% endif %}>
                                    Inactive
                                </option>

                            </select>

                        </div>

                        <button class="btn btn-success">
                            Update User
                        </button>

                        <a href="{{ url_for('admin.users') }}"
                           class="btn btn-secondary">
                            Cancel
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
