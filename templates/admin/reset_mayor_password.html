{% extends 'layout.html' %}

{% block title %}Reset Mayor Password{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow border-0 rounded-4 overflow-hidden">

                <div class="bg-primary text-white text-center p-4">

                    <i class="bi bi-key-fill fs-1"></i>
                    <h3 class="mt-2 mb-1 fw-bold">Reset Mayor Password</h3>

                    <p class="mb-0 opacity-75">
                        Administrator access required
                    </p>

                </div>

                <div class="card-body p-4">

                    {% if mayor %}

                    <div class="alert alert-info rounded-3">

                        <strong>Mayor Account:</strong><br>
                        {{ mayor[1] }}<br>
                        {{ mayor[2] }}

                    </div>

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                New Temporary Password
                            </label>

                            <input type="password"
                                   name="new_password"
                                   class="form-control rounded-3 py-2"
                                   required>

                        </div>

                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Confirm Password
                            </label>

                            <input type="password"
                                   name="confirm_password"
                                   class="form-control rounded-3 py-2"
                                   required>

                        </div>

                        <button type="submit"
                                class="btn btn-primary w-100 rounded-3 py-2 fw-semibold">

                            <i class="bi bi-shield-lock-fill me-2"></i>
                            Reset Mayor Password

                        </button>

                    </form>

                    {% else %}

                    <div class="alert alert-danger rounded-3 mb-0">

                        No mayor account found in the system.

                    </div>

                    {% endif %}

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
