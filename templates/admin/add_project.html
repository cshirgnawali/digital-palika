{% extends "layout.html" %}

{% block title %}Add Project{% endblock %}

{% block content %}

<div class="d-flex">

    {% include 'includes/sidebar.html' %}

    <div class="main-content">

        {% include 'includes/navbar.html' %}

        <div class="container-fluid p-4">

            <div class="card shadow border-0">

                <div class="card-header bg-primary text-white">

                    <h4 class="mb-0">
                        Add New Project
                    </h4>

                </div>

                <div class="card-body">

                    {% if error %}

                    <div class="alert alert-danger">

                        {{ error }}

                    </div>

                    {% endif %}

                    <form method="POST">

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Department
                                </label>

                                <select name="department_id"
                                        class="form-select"
                                        required>

                                    <option value="">
                                        Select Department
                                    </option>

                                    {% for department in departments %}

                                    <option value="{{ department[0] }}">
                                        {{ department[1] }}
                                    </option>

                                    {% endfor %}

                                </select>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Ward
                                </label>

                                <select name="ward_id"
                                        class="form-select"
                                        required>

                                    <option value="">
                                        Select Ward
                                    </option>

                                    {% for ward in wards %}

                                    <option value="{{ ward[0] }}">
                                        Ward {{ ward[1] }}
                                    </option>

                                    {% endfor %}

                                </select>

                            </div>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Project Name
                            </label>

                            <input type="text"
                                   name="project_name"
                                   class="form-control"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Description
                            </label>

                            <textarea name="description"
                                      rows="4"
                                      class="form-control"></textarea>

                        </div>

                        <div class="row">

                            <div class="col-md-4 mb-3">

                                <label class="form-label">
                                    Estimated Cost
                                </label>

                                <input type="number"
                                       step="0.01"
                                       name="estimated_cost"
                                       class="form-control"
                                       required>

                            </div>

                            <div class="col-md-4 mb-3">

                                <label class="form-label">
                                    Start Date
                                </label>

                                <input type="date"
                                       name="start_date"
                                       class="form-control">

                            </div>

                            <div class="col-md-4 mb-3">

                                <label class="form-label">
                                    Expected End Date
                                </label>

                                <input type="date"
                                       name="expected_end_date"
                                       class="form-control">

                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Status
                                </label>

                                <select name="status"
                                        class="form-select">

                                    <option value="Planned">
                                        Planned
                                    </option>

                                    <option value="Ongoing">
                                        Ongoing
                                    </option>

                                    <option value="Completed">
                                        Completed
                                    </option>

                                    <option value="Cancelled">
                                        Cancelled
                                    </option>

                                </select>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Contractor Name
                                </label>

                                <input type="text"
                                       name="contractor_name"
                                       class="form-control">

                            </div>

                        </div>

                        <div class="mt-4">

                            <button class="btn btn-success">

                                <i class="bi bi-check-circle-fill"></i>

                                Save Project

                            </button>

                            <a href="{{ url_for('projects.project_list') }}"
                               class="btn btn-secondary">

                                Cancel

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
