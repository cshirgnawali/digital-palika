{% extends "layout.html" %}

{% block title %}Edit Department{% endblock %}

{% block content %}

<div class="d-flex">

    {% include 'includes/sidebar.html' %}

    <div class="main-content">

        {% include 'includes/navbar.html' %}

        <div class="container-fluid p-4">

            <div class="card shadow border-0">

                <div class="card-header bg-warning">

                    <h4 class="mb-0">

                        <i class="bi bi-pencil-square"></i>

                        Edit Department

                    </h4>

                </div>

                <div class="card-body">

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">

                                Department Name

                            </label>

                            <input
                                type="text"
                                name="department_name"
                                class="form-control"
                                value="{{ department[1] }}"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Description

                            </label>

                            <textarea
                                name="description"
                                rows="4"
                                class="form-control"
                                required>{{ department[2] }}</textarea>

                        </div>

                        <button class="btn btn-success">

                            <i class="bi bi-check-circle-fill"></i>

                            Update Department

                        </button>

                        <a href="{{ url_for('departments.department_list') }}"
                           class="btn btn-secondary">

                            Cancel

                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
