{% extends "layout.html" %}

{% block title %}Edit Ward{% endblock %}

{% block content %}

<div class="d-flex">

    {% include 'includes/sidebar.html' %}

    <div class="main-content">

        {% include 'includes/navbar.html' %}

        <div class="container-fluid p-4">

            <div class="card shadow border-0">

                <div class="card-header bg-warning">

                    <h4 class="mb-0">
                        Edit Ward
                    </h4>

                </div>

                <div class="card-body">

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">
                                Ward Number
                            </label>

                            <input type="number"
                                   class="form-control"
                                   name="ward_number"
                                   value="{{ ward[1] }}"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Ward Name
                            </label>

                            <input type="text"
                                   class="form-control"
                                   name="ward_name"
                                   value="{{ ward[2] }}"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Office Address
                            </label>

                            <input type="text"
                                   class="form-control"
                                   name="office_address"
                                   value="{{ ward[3] }}">

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Ward Chairperson
                            </label>

                            <input type="text"
                                   class="form-control"
                                   name="ward_chairperson"
                                   value="{{ ward[4] }}">

                        </div>

                        <button class="btn btn-warning">

                            <i class="bi bi-pencil-square"></i>

                            Update Ward

                        </button>

                        <a href="{{ url_for('wards.ward_list') }}"
                           class="btn btn-secondary">

                            Cancel

                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
