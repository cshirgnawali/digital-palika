{% extends "layout.html" %}

{% block title %}Reset Password{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5">

        <div class="card shadow border-0 rounded-4 overflow-hidden">

            <div class="bg-primary text-white text-center p-4">

                <i class="bi bi-lock-fill fs-1"></i>
                <h3 class="mt-2 mb-1 fw-bold">Create New Password</h3>

                <p class="mb-0 opacity-75">
                    Your new password must be different from the current one.
                </p>

            </div>

            <div class="card-body p-4">

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label fw-semibold">New Password</label>

                        <div class="input-group">

                            <input type="password"
                                   name="password"
                                   id="newPassword"
                                   class="form-control rounded-start-3 py-2"
                                   placeholder="Enter new password"
                                   required>

                            <button type="button"
                                    class="btn btn-outline-secondary rounded-end-3"
                                    onclick="togglePassword('newPassword', this)">

                                <i class="bi bi-eye"></i>

                            </button>

                        </div>

                    </div>

                    <div class="mb-4">

                        <label class="form-label fw-semibold">Confirm New Password</label>

                        <div class="input-group">

                            <input type="password"
                                   name="confirm_password"
                                   id="confirmPassword"
                                   class="form-control rounded-start-3 py-2"
                                   placeholder="Confirm new password"
                                   required>

                            <button type="button"
                                    class="btn btn-outline-secondary rounded-end-3"
                                    onclick="togglePassword('confirmPassword', this)">

                                <i class="bi bi-eye"></i>

                            </button>

                        </div>

                    </div>

                    <button type="submit"
                            class="btn btn-primary w-100 rounded-3 py-2 fw-semibold"
                            id="resetBtn">

                        <i class="bi bi-arrow-repeat me-2"></i>
                        Reset Password

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

<script>
// Show / Hide Password
function togglePassword(id, button) {

    const input = document.getElementById(id);
    const icon = button.querySelector('i');

    if (input.type === 'password') {

        input.type = 'text';
        icon.classList.remove('bi-eye');
        icon.classList.add('bi-eye-slash');

    } else {

        input.type = 'password';
        icon.classList.remove('bi-eye-slash');
        icon.classList.add('bi-eye');

    }
}

// Loading effect on reset
document.querySelector('form').addEventListener('submit', function() {

    const btn = document.getElementById('resetBtn');

    btn.innerHTML =
        '<span class="spinner-border spinner-border-sm me-2"></span>Resetting...';

    btn.disabled = true;
});
</script>

{% endblock %}
