{% extends "layout.html" %}

{% block title %}Citizen Registration{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow border-0 rounded-4 overflow-hidden">

            <div class="bg-primary text-white text-center p-4">

                <i class="bi bi-person-plus-fill fs-1"></i>
                <h3 class="mt-2 mb-1 fw-bold">Citizen Registration</h3>

                <p class="mb-0 opacity-75">
                    Create your Digital Palika citizen account
                </p>

            </div>

            <div class="card-body p-4">

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label fw-semibold">Full Name</label>

                        <input type="text"
                               name="full_name"
                               class="form-control rounded-3 py-2"
                               placeholder="Enter your full name"
                               required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label fw-semibold">Mobile Number</label>

                        <input type="text"
                               name="mobile_number"
                               class="form-control rounded-3 py-2"
                               placeholder="98XXXXXXXX"
                               required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label fw-semibold">Email Address</label>

                        <input type="email"
                               name="email"
                               class="form-control rounded-3 py-2"
                               placeholder="Enter your email address"
                               required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label fw-semibold">Password</label>

                        <div class="input-group">

                            <input type="password"
                                   name="password"
                                   id="password"
                                   class="form-control rounded-start-3 py-2"
                                   placeholder="Create a password"
                                   required>

                            <button type="button"
                                    class="btn btn-outline-secondary rounded-end-3"
                                    onclick="togglePassword('password', this)">

                                <i class="bi bi-eye"></i>

                            </button>

                        </div>

                    </div>

                    <div class="mb-4">

                        <label class="form-label fw-semibold">Confirm Password</label>

                        <div class="input-group">

                            <input type="password"
                                   name="confirm_password"
                                   id="confirmPassword"
                                   class="form-control rounded-start-3 py-2"
                                   placeholder="Confirm your password"
                                   required>

                            <button type="button"
                                    class="btn btn-outline-secondary rounded-end-3"
                                    onclick="togglePassword('confirmPassword', this)">

                                <i class="bi bi-eye"></i>

                            </button>

                        </div>

                    </div>

                    <button type="submit"
                            class="btn btn-primary w-100 rounded-3 py-2 fw-semibold"
                            id="registerBtn">

                        <i class="bi bi-envelope-paper-fill me-2"></i>
                        Register & Send Verification Code

                    </button>

                </form>

                <div class="text-center mt-4">

                    <span class="text-muted">Already have an account?</span>

                    <a href="{{ url_for('auth.login') }}"
                       class="text-decoration-none fw-semibold ms-1">

                        Login here

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

<script>
// Show / Hide Password
function togglePassword(id, button) {

    const input = document.getElementById(id);
    const icon = button.querySelector('i');

    if (input.type === 'password') {

        input.type = 'text';
        icon.classList.remove('bi-eye');
        icon.classList.add('bi-eye-slash');

    } else {

        input.type = 'password';
        icon.classList.remove('bi-eye-slash');
        icon.classList.add('bi-eye');

    }
}

// Loading effect on registration
document.querySelector('form').addEventListener('submit', function() {

    const btn = document.getElementById('registerBtn');

    btn.innerHTML =
        '<span class="spinner-border spinner-border-sm me-2"></span>Sending Verification Code...';

    btn.disabled = true;
});
</script>

{% endblock %}
