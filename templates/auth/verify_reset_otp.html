{% extends "layout.html" %}

{% block title %}Verify Reset OTP{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow border-0 rounded-4">

                <div class="card-header bg-primary text-white text-center py-4">

                    <i class="bi bi-shield-check fs-1"></i>
                    <h3 class="mt-2 mb-0">Verify Reset Code</h3>

                </div>

                <div class="card-body p-4 text-center">

                    <p class="text-muted">
                        Enter the verification code sent to:
                    </p>

                    <p class="fw-semibold text-primary mb-4">
                        {{ email }}
                    </p>

                    <form method="POST">

                        <div class="mb-4">

                            <input type="text"
                                   name="otp"
                                   class="form-control form-control-lg text-center rounded-4"
                                   placeholder="Enter 6-digit code"
                                   maxlength="6"
                                   required>

                        </div>

                        <button type="submit"
                                class="btn btn-primary w-100 rounded-4 py-2 fw-semibold">

                            Verify Code

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
